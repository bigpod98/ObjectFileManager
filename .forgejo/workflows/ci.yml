name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: docker
    container:
      image: node:22-bookworm
    timeout-minutes: 30
    services:
      minio:
        image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
        cmd: ["server", "/data"]
        env:
          MINIO_ROOT_USER: s3browser-test
          MINIO_ROOT_PASSWORD: s3browser-test-secret
    env:
      S3_TEST_ENDPOINT: http://minio:9000
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install desktop test dependencies
        run: bash scripts/ci/install-deps.sh
      - name: Check formatting, backend integration and Electron workflows
        run: bash scripts/ci/check.sh
      - name: Verify x86_64 and ARM64 Electron bundles build
        run: npm run pack -- --linux --x64 --arm64 --publish never
