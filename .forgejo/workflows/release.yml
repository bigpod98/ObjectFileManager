name: Release

# One publication path: stable version tags, never a competing release event.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: docker
    container:
      image: node:22-bookworm
    timeout-minutes: 180
    services:
      minio:
        image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
        cmd: ["server", "/data"]
        env:
          MINIO_ROOT_USER: s3browser-test
          MINIO_ROOT_PASSWORD: s3browser-test-secret
    env:
      S3_TEST_ENDPOINT: http://minio:9000
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify stable tag, version and checked-out commit
        run: node scripts/ci/release.cjs validate
      - name: Install build and desktop test dependencies
        run: bash scripts/ci/install-deps.sh packages
      - name: Check formatting, backend integration and Electron workflows
        run: bash scripts/ci/check.sh
      - name: Enable ARM64 package containers
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Enable multi-platform Docker builds
        uses: docker/setup-buildx-action@v3
      - name: Build Linux x86_64 and ARM64 portable archives
        run: npm run dist:portable -- --x64 --arm64 --publish never
      - name: Build DEB, RPM and Arch packages from the same bundle
        run: |
          npm run dist:packages -- --x64 --skip-bundle
          npm run dist:packages -- --arm64 --skip-bundle
      - name: Install, launch and uninstall every native package
        run: |
          npm run test:packages -- --x64
          npm run test:packages -- --arm64
      - name: Test the packaged Electron application
        env:
          S3_TEST_EXECUTABLE: ./dist/linux-unpacked/s3-browser
          S3_TEST_NO_SANDBOX: "1"
        run: xvfb-run -a npm run test:desktop
      - name: Collect exact-version assets and checksums
        run: node scripts/ci/release.cjs prepare
      - name: Publish assets to this tag's Forgejo release
        env:
          FORGEJO_URL: ${{ github.server_url }}
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: node scripts/ci/release.cjs publish
