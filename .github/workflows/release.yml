name: Release

# One publication path: stable version tags, never a competing release event.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-refs/tags/${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            bundle: linux-unpacked
          - arch: arm64
            runner: ubuntu-24.04-arm
            bundle: linux-arm64-unpacked
    runs-on: ${{ matrix.runner }}
    container:
      image: node:22-bookworm@sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384
    timeout-minutes: 180
    outputs:
      release_sha: ${{ steps.source.outputs.commit }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the release tag
        id: source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Trust the mounted checkout in the build container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify stable tag, version and checked-out commit
        env:
          RELEASE_SHA: ${{ github.event_name == 'push' && github.sha || steps.source.outputs.commit }}
        run: node scripts/ci/release.cjs validate
      - name: Install build and desktop test dependencies
        run: bash scripts/ci/install-deps.sh packages
      - name: Install pinned Go toolchain for MinIO source build
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.5"
          cache: false
      - name: Build pinned MinIO and install Azurite test services
        run: bash scripts/ci/install-test-services.sh
      - name: Check formatting, backend integration and Electron workflows
        run: bash scripts/ci/with-test-services.sh bash scripts/ci/check.sh
      - name: Set up Docker Buildx for native package builders
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: v0.38.1
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Build portable archive
        run: npm run dist:portable -- --${{ matrix.arch }} --publish never
      - name: Build DEB, RPM and Arch packages from the same bundle
        run: npm run dist:packages -- --${{ matrix.arch }} --skip-bundle
      - name: Install, launch and uninstall every native package
        run: npm run test:packages -- --${{ matrix.arch }}
      - name: Test the packaged Electron application
        env:
          S3_TEST_EXECUTABLE: ./dist/${{ matrix.bundle }}/objectfilemanager
          S3_TEST_NO_SANDBOX: "1"
        run: |
          bash scripts/ci/with-test-services.sh xvfb-run -a npm run test:desktop
          xvfb-run -a npm run test:desktop:identity
      - name: Keep tested packages for publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/objectfilemanager-*-linux-${{ matrix.arch }}.tar.gz
            dist/native/deb/*.deb
            dist/native/rpm/*.rpm
            dist/native/alpm/*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish verified release assets
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.4"
      - name: Download packages from both successful build jobs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - name: Collect exact-version assets and checksums
        run: node scripts/ci/release.cjs prepare
      - name: Publish assets to this tag's GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/release.cjs publish
